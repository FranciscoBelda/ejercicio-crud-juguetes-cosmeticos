@if (loaded) {
  <div class="row my-3 justify-content-center">
    <div class="col-md-6 my-4">
      <div class="input-group">
        <span class="input-group-text">
          <fa-icon [icon]="faMagnifyingGlass"></fa-icon>
        </span>
        <input type="search" class="form-control" placeholder="Search" (input)="buscar($event)">
      </div>

    </div>
    <div class="col-12 d-flex justify-content-center">
      <ngb-pagination
        [(page)]="currentPage"
        (pageChange)="changePage($event)"
        [collectionSize]="apiData.juguetes.info.total"
        [pageSize]="9"
        [ellipses]="true"
        [maxSize]="3"
        [boundaryLinks]="true"></ngb-pagination>
    </div>

    @for (juguete of jugueteList; track juguete._id) {
      <div class="col-md-4 my-2">
        <div class="card shadow">
          <div class="card-header bg-light-subtle">
            <h5 class="card-title text-capitalize">{{juguete.nombre}}</h5>
          </div>
          <img [src]="juguete.imagen" [alt]="juguete.nombre" class="card-img-top">
          <div class="card-body">
            <p class="badge bg-primary">{{juguete.categoria}}</p>
            <p><strong>Edad mínima: </strong><span class="text-primary">{{juguete.edadMinima}}</span></p>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <h5 class="text-success pointer" (click)="addToCart(juguete)">
              {{juguete.precio | currency: 'EUR'}}
              <fa-icon [icon]="faCartShopping"></fa-icon>
            </h5>
            <h4><fa-icon [routerLink]="'/juguetes/edit/'+juguete._id" [icon]="faEdit" class="text-primary"></fa-icon>
              <fa-icon data-bs-toggle="modal"
                       [attr.data-bs-target]="'#modal-'+juguete._id"
                       [icon]="faTrashCan"
                       class="text-danger"></fa-icon> </h4>
          </div>

          <!-- Modal -->
          <div class="modal fade" [id]="'modal-'+juguete._id"
               tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header bg-danger">
                  <h1 class="modal-title text-light fs-5" id="exampleModalLabel">Borrando Juguete</h1>
                  <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                  ¿Desea borrar el juguete {{juguete.nombre}}?
                </div>
                <div class="modal-footer">
                  <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                  <button type="button" class="btn btn-danger" data-bs-dismiss="modal" (click)="deleteJuguete(juguete)">BORRAR</button>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>

 }
    <div class="col-12 d-flex justify-content-center mt-5">
      <ngb-pagination
        [(page)]="currentPage"
        (pageChange)="changePage($event)"
        [collectionSize]="apiData.juguetes.info.total"
        [pageSize]="9"
        [ellipses]="true"
        [maxSize]="3"
        [boundaryLinks]="true"></ngb-pagination>
    </div>
  </div>
} @else {
  <div class="d-flex justify-content-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
}
