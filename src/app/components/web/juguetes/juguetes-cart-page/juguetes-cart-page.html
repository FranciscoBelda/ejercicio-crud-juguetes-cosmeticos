<div class="row my-5 justify-content-center">
  <div class="col-md-8">
    <table class="table table-striped">
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">Juguete</th>
        <th scope="col">Quantity</th>
        <th scope="col">Price</th>
        <th scope="col">Subtotal</th>
      </tr>
      </thead>
      <tbody>
        @for (juguete of cartItems(); track juguete._id) {
          <tr>
            <th scope="row">{{$index + 1}}</th>
            <td>{{juguete.nombre}}</td>
            <td>{{juguete.quantity}}</td>
            <td>{{juguete.precio}}</td>
            <td>{{juguete.precio * juguete.quantity}}</td>
          </tr>
        }
      </tbody>
      <tfoot>
        <tr class="bg-primary text-light">
          <th scope="col">#</th>
          <th scope="col">Total</th>
          <th scope="col">{{cartTotalItems()}}</th>
          <th scope="col"></th>
          <th scope="col">{{cartTotalPrice()}}</th>
        </tr>
      </tfoot>
    </table>
  </div>
</div>
